<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Interactive Particle Waves</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: radial-gradient(
        ellipse at 65% 100%,
        #202526 0%,
        #111516 42%,
        #060809 76%,
        #020303 100%
      );
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="wave" aria-hidden="true"></canvas>

  <script id="vertex-shader" type="x-shader/x-vertex">#version 300 es
    precision highp float;

    uniform vec2 uGrid;
    uniform vec3 uPointer;
    uniform float uTime;
    uniform float uAspect;
    uniform float uViewportHeight;

    out float vAlpha;

    float hash12(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    float valueNoise(vec2 p) {
      vec2 cell = floor(p);
      vec2 local = fract(p);
      local = local * local * (3.0 - 2.0 * local);

      float a = hash12(cell);
      float b = hash12(cell + vec2(1.0, 0.0));
      float c = hash12(cell + vec2(0.0, 1.0));
      float d = hash12(cell + vec2(1.0, 1.0));

      return mix(mix(a, b, local.x), mix(c, d, local.x), local.y);
    }

    void main() {
      float index = float(gl_VertexID);
      float row = floor(index / uGrid.x);
      float column = mod(index, uGrid.x);
      vec2 uv = vec2(column, row) / (uGrid - 1.0);

      // A wide ground plane: near rows sit at the bottom, far rows recede
      // toward a narrow horizon. Perspective makes the horizon denser.
      // The plane widens toward the viewer and extends beyond both viewport
      // boundaries. This keeps its near edge below the screen at every pitch.
      float x = (uv.x - 0.5) * mix(119.0, 218.0, uv.y);
      float z = mix(54.0, -119.0, pow(uv.y, 1.12));

      // Slowly evolving, decorrelated noise fields break up long, aligned
      // crests. Each field travels in a different direction and at a
      // different spatial scale, so the surface stays continuous but does
      // not settle into repeated rows.
      float broadNoise = valueNoise(vec2(
        x * 0.075 + uTime * 0.34,
        z * 0.082 - uTime * 0.29
      ));
      float fineNoise = valueNoise(vec2(
        x * 0.17 - uTime * 0.53,
        z * 0.155 + uTime * 0.44
      ));
      float detailNoise = valueNoise(vec2(
        x * 0.31 + z * 0.08 + uTime * 0.67,
        z * 0.27 - x * 0.065 - uTime * 0.58
      ));
      float patchNoise = valueNoise(vec2(
        x * 0.048 + z * 0.031 + uTime * 0.14,
        z * 0.052 - x * 0.024 - uTime * 0.11
      ));
      float crossPatch = valueNoise(vec2(
        -x * 0.034 + z * 0.071 - uTime * 0.13,
        x * 0.064 + z * 0.039 + uTime * 0.15
      ));
      float finePatch = valueNoise(vec2(
        x * 0.155 + z * 0.118 + uTime * 0.27,
        z * 0.142 - x * 0.127 - uTime * 0.23
      ));

      // Use the noise as a gentle 2D domain warp, not as random per-frame
      // displacement. This bends individual wave fronts in different places
      // without making the particles jitter.
      vec2 warped = vec2(
        x + (broadNoise - 0.5) * 4.4
          + (detailNoise - 0.5) * 1.5
          + (patchNoise - 0.5) * 4.8,
        z + (fineNoise - 0.5) * 3.8
          - (detailNoise - 0.5) * 1.6
          + (crossPatch - 0.5) * 4.6
      );

      // A spread of wave directions avoids parallel bands. Their local phase
      // and amplitude are modulated by separate noise fields, causing crests
      // to split, bend, and merge rather than lining up across the plane.
      float phaseA = warped.x * 0.32 + warped.y * 0.16 + uTime * 1.16
                   + (broadNoise - 0.5) * 1.0
                   + (patchNoise - 0.5) * 2.7
                   + (crossPatch - 0.5) * 1.25;
      float phaseB = -warped.x * 0.21 + warped.y * 0.29 - uTime * 0.98
                   + (fineNoise - 0.5) * 1.0
                   + (crossPatch - 0.5) * 2.9
                   + (finePatch - 0.5) * 1.25;
      float phaseC = -warped.x * 0.12 - warped.y * 0.405
                   + uTime * 0.91
                   + (patchNoise - 0.5) * 2.25
                   - (finePatch - 0.5) * 1.1;
      float phaseD = warped.x * 0.34 - warped.y * 0.29 + uTime * 0.82
                   + (crossPatch - 0.5) * 2.5
                   + (finePatch - 0.5) * 1.15;
      float phaseE = -warped.x * 0.43 - warped.y * 0.13 - uTime * 1.48
                   + (patchNoise - 0.5) * 1.65
                   - (crossPatch - 0.5) * 2.1
                   + (finePatch - 0.5) * 0.8;

      float energyA = 0.84 + patchNoise * 0.32;
      float energyB = 0.82 + crossPatch * 0.36;
      float energyC = 0.82 + finePatch * 0.36;
      float energyD = 0.84 + crossPatch * 0.32;
      float energyE = 0.88 + patchNoise * 0.24;

      float broadWave = sin(phaseA) * 0.56 * energyA;
      float crossWave = sin(phaseB) * 0.34 * energyB;
      float longWave = cos(phaseC) * 0.27 * energyC;
      float diagonalWave = sin(phaseD) * 0.19 * energyD;
      float shortWave = sin(phaseE) * 0.11 * energyE;
      float noiseLift = (patchNoise - 0.5) * 0.16
                      + (crossPatch - 0.5) * 0.13
                      + (finePatch - 0.5) * 0.07;

      // Give the near field a little more vertical travel. This counters the
      // compressed perspective at the front and keeps its peaks readable.
      float frontAmount = 1.0 - smoothstep(0.12, 0.78, uv.y);
      float frontWaveBoost = mix(1.0, 1.48, frontAmount);

      // Pointer movement only steers the camera; wave vertices are never
      // displaced by the pointer, so the dots remain stable while it moves.
      float rawWaveHeight = broadWave + crossWave + longWave
                          + diagonalWave + shortWave + noiseLift;
      float y = rawWaveHeight * frontWaveBoost;
      vec3 position = vec3(x, y, z);

      // Cursor axes follow familiar spatial expectations: left/right steers
      // yaw, up/down steers pitch. A restrained diagonal component adds roll
      // without making the primary controls feel cross-wired.
      // Neutral roll remains 25 degrees, keeping the plane on the viewer's
      // right-hand side. The cursor starts neutral at the viewport centre.
      const vec3 target = vec3(0.0, 0.0, -8.0);
      float cameraYaw = 0.68 - uPointer.x * 0.30;
      float cameraPitch = 0.36 + uPointer.y * 0.22;
      float cameraRoll = -0.4363323130 + uPointer.z * 0.16;
      float cameraDistance = 32.0;
      vec3 cameraOffset = vec3(
        -sin(cameraYaw) * cos(cameraPitch),
        sin(cameraPitch),
        cos(cameraYaw) * cos(cameraPitch)
      );
      vec3 cameraPosition = target + cameraOffset * cameraDistance;

      vec3 forward = normalize(target - cameraPosition);
      vec3 right = normalize(cross(forward, vec3(0.0, 1.0, 0.0)));
      vec3 cameraUp = cross(right, forward);
      vec3 relative = position - cameraPosition;

      // Roll the camera basis around its viewing axis. The negative 45-degree
      // default reverses the previous diagonal so the plane occupies the
      // viewer's right-hand side of the screen.
      float rollCos = cos(cameraRoll);
      float rollSin = sin(cameraRoll);
      vec3 rolledRight = right * rollCos + cameraUp * rollSin;
      vec3 rolledUp = cameraUp * rollCos - right * rollSin;

      float depth = dot(relative, forward);
      float viewX = dot(relative, rolledRight);
      float viewY = dot(relative, rolledUp);
      const float tanHalfFov = 0.50;

      // The near rows extend behind the camera. Discard those points instead
      // of allowing a clipped or artificial edge to appear at the bottom.
      if (depth <= 0.1) {
        gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
        gl_PointSize = 1.0;
        vAlpha = 0.0;
        return;
      }

      float screenX = viewX / (uAspect * tanHalfFov * depth);
      float screenY = viewY / (tanHalfFov * depth);

      gl_Position = vec4(
        screenX,
        screenY,
        0.0,
        1.0
      );

      // Perspective remains the base size relationship: foreground points
      // are larger. Wave elevation adds a moderate size contrast: troughs
      // remain visible while crests expand, with a slightly lower size cap.
      // The near-field displacement above keeps this contrast readable up front.
      float perspectiveSize = 0.064 * uViewportHeight
                            / (tanHalfFov * max(depth, 1.0));
      float normalizedElevation = clamp(y / 1.70, -1.0, 1.0);
      float crestResponse = smoothstep(-0.62, 0.72, normalizedElevation);
      crestResponse = pow(crestResponse, 1.55);
      // Keep trough particles visibly present while retaining a clear,
      // slightly stronger crest response.
      float elevationSize = mix(0.32, 1.58, crestResponse);
      gl_PointSize = clamp(perspectiveSize * elevationSize, 0.8, 13.8);

      float farAmount = smoothstep(12.0, 86.0, depth);
      float waveLight = smoothstep(-0.55, 0.62, y);
      float troughVisibility = mix(
        0.26,
        1.0,
        smoothstep(-0.95, -0.18, normalizedElevation)
      );
      float horizonFade = 1.0 - smoothstep(0.82, 1.0, uv.y);

      // Do not clip the plane against a diagonal or upper screen boundary.
      // The larger world-space mesh continues beyond the viewport, so camera
      // rotation reveals more of the same surface instead of exposing an edge.
      // Only the existing distant-horizon fade remains.
      vAlpha = mix(0.64, 0.25, farAmount)
             * mix(0.90, 1.0, waveLight)
             * troughVisibility
             * horizonFade;
    }
  </script>

  <script id="fragment-shader" type="x-shader/x-fragment">#version 300 es
    precision highp float;

    in float vAlpha;
    out vec4 outColor;

    void main() {
      float radius = length(gl_PointCoord - vec2(0.5));
      float edge = 1.0 - smoothstep(0.28, 0.5, radius);
      float alpha = vAlpha * edge;
      vec3 color = vec3(0.82, 0.86, 0.89);
      outColor = vec4(color * alpha, alpha);
    }
  </script>

  <script>
    (() => {
      const canvas = document.getElementById('wave');
      const gl = canvas.getContext('webgl2', {
        alpha: true,
        antialias: false,
        depth: false,
        stencil: false,
        powerPreference: 'high-performance'
      });

      if (!gl) {
        console.error('This background requires WebGL 2. Enable hardware acceleration or use a WebGL 2 compatible browser.');
        return;
      }

      const vertexSource = document.getElementById('vertex-shader').textContent;
      const fragmentSource = document.getElementById('fragment-shader').textContent;

      function compileShader(type, source) {
        const shader = gl.createShader(type);
        if (!shader) throw new Error('Could not create shader.');
        gl.shaderSource(shader, source);
        gl.compileShader(shader);

        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          const message = gl.getShaderInfoLog(shader);
          gl.deleteShader(shader);
          throw new Error(message || 'Shader compilation failed.');
        }

        return shader;
      }

      let program;
      try {
        const vertexShader = compileShader(gl.VERTEX_SHADER, vertexSource);
        const fragmentShader = compileShader(gl.FRAGMENT_SHADER, fragmentSource);
        program = gl.createProgram();
        if (!program) throw new Error('Could not create WebGL program.');

        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        gl.deleteShader(vertexShader);
        gl.deleteShader(fragmentShader);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          throw new Error(gl.getProgramInfoLog(program) || 'Program linking failed.');
        }
      } catch (error) {
        console.error('Particle waves could not start:', error);
        return;
      }

      gl.useProgram(program);
      const vertexArray = gl.createVertexArray();
      gl.bindVertexArray(vertexArray);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

      const uniforms = {
        grid: gl.getUniformLocation(program, 'uGrid'),
        pointer: gl.getUniformLocation(program, 'uPointer'),
        time: gl.getUniformLocation(program, 'uTime'),
        aspect: gl.getUniformLocation(program, 'uAspect'),
        viewportHeight: gl.getUniformLocation(program, 'uViewportHeight')
      };

      // More vertices compensate for the larger world-space plane, preserving
      // approximately the previous particle spacing and visual density.
      let columns = 150;
      let rows = 90;
      let pixelRatio = 1;
      let targetX = 0;
      let targetY = 0;
      let pointerX = 0;
      let pointerY = 0;
      let targetRoll = 0;
      let pointerRoll = 0;
      let elapsed = 0;
      let previousFrame = 0;
      let animationFrame = 0;

      function resize() {
        pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
        canvas.width = Math.max(1, Math.round(window.innerWidth * pixelRatio));
        canvas.height = Math.max(1, Math.round(window.innerHeight * pixelRatio));
        gl.viewport(0, 0, canvas.width, canvas.height);

        gl.uniform2f(uniforms.grid, columns, rows);
        gl.uniform1f(uniforms.aspect, window.innerWidth / Math.max(1, window.innerHeight));
        gl.uniform1f(uniforms.viewportHeight, canvas.height);
      }

      function movePointer(event) {
        if (event.pointerType === 'touch') return;

        targetX = (event.clientX / Math.max(1, window.innerWidth)) * 2.0 - 1.0;
        targetY = 1.0 - (event.clientY / Math.max(1, window.innerHeight)) * 2.0;

        // Keep yaw and pitch intuitive and axis-aligned. Roll follows a subtle
        // diagonal blend, so ordinary cursor movement still influences it
        // without competing with the primary left/right and up/down cues.
        targetRoll = Math.max(-1.0, Math.min(1.0,
          (targetX - targetY) * 0.5
        ));
      }

      function resetPointer() {
        targetX = 0;
        targetY = 0;
        targetRoll = 0;
      }

      function render(timestamp) {
        animationFrame = 0;
        if (document.hidden) return;

        const delta = Math.min(0.05, (timestamp - (previousFrame || timestamp)) / 1000);
        previousFrame = timestamp;
        elapsed += delta;

        const easing = 1.0 - Math.exp(-2.7 * delta);
        const rollEasing = 1.0 - Math.exp(-2.0 * delta);
        pointerX += (targetX - pointerX) * easing;
        pointerY += (targetY - pointerY) * easing;
        pointerRoll += (targetRoll - pointerRoll) * rollEasing;

        gl.clearColor(0, 0, 0, 0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.uniform3f(uniforms.pointer, pointerX, pointerY, pointerRoll);
        gl.uniform1f(uniforms.time, elapsed);
        gl.drawArrays(gl.POINTS, 0, columns * rows);

        animationFrame = requestAnimationFrame(render);
      }

      window.addEventListener('resize', resize, { passive: true });
      window.addEventListener('pointermove', movePointer, { passive: true });
      window.addEventListener('blur', resetPointer);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && !animationFrame) {
          previousFrame = 0;
          animationFrame = requestAnimationFrame(render);
        }
      });

      resize();
      animationFrame = requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
